<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Шторм унёс страницу | Atlantic Sail</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; background: #f8f6f1; }
    .as-404 { max-width: 600px; }
    .as-404 h1 { font-size: 6rem; color: var(--gold); margin: 0; line-height: 1; }
    .as-404 h2 { font-size: 1.5rem; margin: 1rem 0; color: #333; }
    .as-404 p { color: #666; margin-bottom: 2rem; font-size: 1.05rem; line-height: 1.6; }
    .as-404 .as-btn { display: inline-block; padding: 0.8rem 2rem; background: var(--gold); color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; transition: background 0.2s; }
    .as-404 .as-btn:hover { background: #b8860b; }
  </style>
</head>
<body>
  <div class="as-404">
    <h1>404</h1>
    <h2>Шторм унёс эту страницу 🌊</h2>
    <p>Кажется, девятый вал оказался сильнее — карту смыло за борт.<br>Но мы на связи, капитан. Давайте вернёмся на главную и продолжим путь.</p>
    <a href="/" class="as-btn">⛵ На главную</a>
  </div>
</body>
</html>
