<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Капитан в море — Atlantic Sail</title>
  <link rel="canonical" href="https://atlanticsail.net/track.html" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --ocean: #0a1628;
      --deep: #0d1f3c;
      --wave: #1a3a5c;
      --accent: #00c6ff;
      --gold: #f4c542;
      --text: #e8f4f8;
      --muted: #7a9bb5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ocean);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      padding: 18px 24px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,198,255,0.15);
      background: linear-gradient(180deg, rgba(10,22,40,1) 0%, rgba(10,22,40,0.8) 100%);
      position: relative;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-mark {
      width: 36px; height: 36px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text);
    }
    .logo-sub {
      font-size: 10px; color: var(--muted); letter-spacing: 0.08em;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-bar {
      display: flex; align-items: center; gap: 12px;
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(0,198,255,0.6);
      animation: pulse 2s infinite;
    }
    .pulse-dot.offline { background: var(--muted); animation: none; box-shadow: none; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(0,198,255,0.6); }
      70%  { box-shadow: 0 0 0 8px rgba(0,198,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,198,255,0); }
    }
    .status-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--accent); letter-spacing: 0.05em;
    }
    .status-text.offline { color: var(--muted); }

    /* ── MAP ── */
    #map {
      flex: 1;
      min-height: calc(100vh - 160px);
      z-index: 1;
    }

    /* Leaflet dark tiles */
    .leaflet-tile-pane { filter: brightness(0.75) saturate(0.8) hue-rotate(195deg); }

    /* ── INFO PANEL ── */
    .info-panel {
      position: absolute;
      bottom: 80px; left: 20px;
      z-index: 100;
      background: rgba(10,22,40,0.92);
      border: 1px solid rgba(0,198,255,0.25);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 220px;
      backdrop-filter: blur(12px);
    }
    .info-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 15px; font-weight: 700; color: var(--text);
      margin-bottom: 12px;
    }
    .info-value:last-child { margin-bottom: 0; }
    .info-coord {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--accent);
    }

    /* ── FOOTER ── */
    footer {
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid rgba(0,198,255,0.1);
      background: var(--ocean);
      position: relative; z-index: 10;
    }
    .update-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--muted);
    }
    .update-info span { color: var(--accent); }
    .back-link {
      font-size: 12px; color: var(--muted); text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    /* ── BOAT ICON ── */
    .boat-icon { font-size: 22px; }

    /* ── NO DATA STATE ── */
    .no-data {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 200;
      text-align: center;
      pointer-events: none;
    }
    .no-data-emoji { font-size: 48px; margin-bottom: 12px; }
    .no-data-text { font-size: 16px; font-weight: 700; color: var(--muted); }
    .no-data-sub { font-size: 12px; color: rgba(122,155,181,0.6); margin-top: 4px;
      font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-mark">⚓</div>
    <div>
      <div class="logo-text">Atlantic Sail</div>
      <div class="logo-sub">live track</div>
    </div>
  </a>
  <div class="status-bar">
    <div class="pulse-dot" id="pulseDot"></div>
    <div class="status-text" id="statusText">обновление...</div>
  </div>
</header>

<div style="position:relative; flex:1; display:flex; flex-direction:column;">
  <div id="map"></div>

  <div class="info-panel" id="infoPanel" style="display:none;">
    <div class="info-label">последняя точка</div>
    <div class="info-value" id="lastTime">—</div>
    <div class="info-label">координаты</div>
    <div class="info-value info-coord" id="lastCoord">—</div>
    <div class="info-label">точек в треке</div>
    <div class="info-value" id="pointCount">—</div>
  </div>

  <div class="no-data" id="noData">
    <div class="no-data-emoji">⛵</div>
    <div class="no-data-text">Капитан в порту</div>
    <div class="no-data-sub">трек появится когда яхта выйдет в море</div>
  </div>
</div>

<footer>
  <div class="update-info">обновление каждые <span>60 сек</span> · следующее через <span id="countdown">60</span>с</div>
  <a href="/" class="back-link">← atlanticsail.net</a>
</footer>

<script>
// ══════════════════════════════════════════════
// КОНФИГ — поменять на свои данные
// ══════════════════════════════════════════════
const CONFIG = {
  // Google Sheets: Файл → Поделиться → Опубликовать в интернете → CSV
  // Формат таблицы: колонки lat | lon | time | note
  SHEET_CSV_URL: 'https://docs.google.com/spreadsheets/d/ТВОЙ_ID/export?format=csv&gid=0',

  UPDATE_INTERVAL: 60, // секунд
  DEFAULT_CENTER: [28.15, -15.43], // Лас-Пальмас
  DEFAULT_ZOOM: 7,
};
// ══════════════════════════════════════════════

// Инициализация карты
const map = L.map('map', {
  center: CONFIG.DEFAULT_CENTER,
  zoom: CONFIG.DEFAULT_ZOOM,
  zoomControl: true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 18,
}).addTo(map);

// Иконка яхты
const boatIcon = L.divIcon({
  html: '<div style="font-size:26px;filter:drop-shadow(0 0 6px #00c6ff);">⛵</div>',
  iconSize: [30, 30],
  iconAnchor: [15, 15],
  className: '',
});

const dotIcon = L.divIcon({
  html: '<div style="width:8px;height:8px;background:#00c6ff;border-radius:50%;opacity:0.6;border:1px solid rgba(0,198,255,0.3)"></div>',
  iconSize: [8, 8],
  iconAnchor: [4, 4],
  className: '',
});

let trackLayer = null;
let markers = [];
let boatMarker = null;
let countdown = CONFIG.UPDATE_INTERVAL;

// ── Загрузка данных ──
async function loadTrack() {
  try {
    const res = await fetch(CONFIG.SHEET_CSV_URL + '&_=' + Date.now());
    const text = await res.text();
    const points = parseCSV(text);
    renderTrack(points);
  } catch (e) {
    setStatus(false);
    console.error('Ошибка загрузки трека:', e);
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n').slice(1); // пропускаем заголовок
  return lines
    .map(line => {
      const [lat, lon, time, note] = line.split(',').map(s => s.replace(/"/g,'').trim());
      const la = parseFloat(lat), lo = parseFloat(lon);
      if (isNaN(la) || isNaN(lo)) return null;
      return { lat: la, lon: lo, time: time || '', note: note || '' };
    })
    .filter(Boolean);
}

function renderTrack(points) {
  // Очищаем старое
  if (trackLayer) map.removeLayer(trackLayer);
  markers.forEach(m => map.removeLayer(m));
  if (boatMarker) map.removeLayer(boatMarker);
  markers = [];

  if (!points.length) {
    document.getElementById('noData').style.display = 'block';
    document.getElementById('infoPanel').style.display = 'none';
    setStatus(false);
    return;
  }

  document.getElementById('noData').style.display = 'none';
  document.getElementById('infoPanel').style.display = 'block';

  // Линия трека
  const latlngs = points.map(p => [p.lat, p.lon]);
  trackLayer = L.polyline(latlngs, {
    color: '#00c6ff',
    weight: 2.5,
    opacity: 0.7,
    dashArray: '6 4',
  }).addTo(map);

  // Точки (все кроме последней)
  points.slice(0, -1).forEach(p => {
    const m = L.marker([p.lat, p.lon], { icon: dotIcon })
      .addTo(map);
    if (p.time || p.note) {
      m.bindPopup(`<b>${p.time}</b>${p.note ? '<br>' + p.note : ''}`, { className: 'dark-popup' });
    }
    markers.push(m);
  });

  // Последняя точка — яхта
  const last = points[points.length - 1];
  boatMarker = L.marker([last.lat, last.lon], { icon: boatIcon })
    .addTo(map)
    .bindPopup(`<b>Текущее положение</b><br>${last.time}<br>${last.note}`, { className: 'dark-popup' });

  // Обновляем инфо-панель
  document.getElementById('lastTime').textContent = last.time || 'нет данных';
  document.getElementById('lastCoord').textContent =
    `${last.lat.toFixed(4)}° N  ${last.lon.toFixed(4)}° E`;
  document.getElementById('pointCount').textContent = points.length;

  // Центрируем на треке
  if (points.length === 1) {
    map.setView([last.lat, last.lon], 10);
  } else {
    map.fitBounds(trackLayer.getBounds(), { padding: [40, 40] });
  }

  setStatus(true);
}

function setStatus(online) {
  const dot = document.getElementById('pulseDot');
  const txt = document.getElementById('statusText');
  if (online) {
    dot.className = 'pulse-dot';
    txt.className = 'status-text';
    txt.textContent = 'в эфире';
  } else {
    dot.className = 'pulse-dot offline';
    txt.className = 'status-text offline';
    txt.textContent = 'нет данных';
  }
}

// ── Таймер обратного отсчёта ──
function startCountdown() {
  countdown = CONFIG.UPDATE_INTERVAL;
  const el = document.getElementById('countdown');
  const timer = setInterval(() => {
    countdown--;
    el.textContent = countdown;
    if (countdown <= 0) {
      clearInterval(timer);
      loadTrack().then(() => startCountdown());
    }
  }, 1000);
}

// ── Старт ──
loadTrack().then(() => startCountdown());
</script>

<!-- Тёмный стиль для попапов Leaflet -->
<style>
.dark-popup .leaflet-popup-content-wrapper {
  background: #0d1f3c;
  border: 1px solid rgba(0,198,255,0.3);
  color: #e8f4f8;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  border-radius: 8px;
}
.dark-popup .leaflet-popup-tip { background: #0d1f3c; }
</style>

</body>
</html>
