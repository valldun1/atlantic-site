    /* STATUS BAR */

    .tr-dot-orange { background: var(--orange-track); box-shadow: 0 0 6px var(--orange-track); }

<body>

<!-- HEADER -->
<header class="tr-header">

  <a href="https://wa.me/34603192089?text=%D0%A5%D0%BE%D1%87%D1%83+%D0%B2+%D0%BF%D1%83%D1%82%D0%B5%D1%88%D0%B5%D1%81%D1%82%D0%B2%D0%B8%D0%B5" target="_blank"
     style="background:var(--gold);color:var(--navy-dark);font-weight:700;font-size:0.78rem;padding:0.4rem 0.9rem;border-radius:4px;text-decoration:none;white-space:nowrap;flex-shrink:0;display:none"

<!-- STATUS BAR -->
<div class="tr-status-bar">
  <div class="tr-captain">
    <div class="tr-dot tr-dot-blue"></div>
    <div>
      <div class="tr-captain-name">Костя</div>
      <div class="tr-captain-pos" id="pos-kostya">загрузка...</div>
    </div>
  </div>
  <div class="tr-sep"></div>
  <div class="tr-captain">
    <div class="tr-dot tr-dot-orange"></div>
    <div>
      <div class="tr-captain-name">Юра</div>
      <div class="tr-captain-pos" id="pos-yura">загрузка...</div>
    </div>
  </div>
  <div class="tr-updated" id="updated">обновление...</div>
</div>

<!-- MAP -->
<div id="map"></div>

<script>
  // Показать WA кнопку на десктопе
  if (window.innerWidth > 600) {
    document.getElementById('wa-btn').style.display = 'block';
  }

  const SHEET_ID = "15uqQA-ankTrNN8U52t9E53dlhPHMof0yb5-2_OFpj7Y";
  const SHEET_NAME = "track";
  const JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

  let map;

  async function loadTrack() {
    try {
      const res = await fetch(JSON_URL);
      if (!res.ok) throw new Error("Не удалось загрузить данные");
      const text = await res.text();
      const jsonStr = text.match(/google\.visualization\.Query\.setResponse\((.+)\);?$/s)?.[1];
      if (!jsonStr) throw new Error("Не удалось распарсить ответ");
      const json = JSON.parse(jsonStr);
      const rows = json.table.rows;

      const byKostya = [];
      const byYura = [];
      let lastKostya = null;
      let lastYura = null;

      rows.forEach(row => {
        const cells = row.c;
        if (!cells || cells.length < 3) return;
        const lat = parseFloat(cells[1]?.v);
        const lon = parseFloat(cells[2]?.v);
        const captain = cells[3]?.v || "kostya";
        const timestamp = cells[0]?.v || "";
        if (isNaN(lat) || isNaN(lon)) return;
        const point = { lat, lng: lon };
        if (captain === "yura") {
          byYura.push(point);
          lastYura = { lat, lon, timestamp };
        } else {
          byKostya.push(point);
          lastKostya = { lat, lon, timestamp };
        }
      });

      function drawTrack(pts, color, label) {
        if (pts.length === 0) return;
        new google.maps.Polyline({
          path: pts,
          geodesic: true,
          strokeColor: color,
          strokeOpacity: 0.9,
          strokeWeight: 3,
          map,
        });
        const last = pts[pts.length - 1];
        new google.maps.Marker({
          position: last,
          map,
          title: label,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 9,
            fillColor: color,
            fillOpacity: 1,
            strokeColor: "#fff",
            strokeWeight: 2,
          },
        });
      }

      drawTrack(byKostya, "#4a9eff", "Костя");
      drawTrack(byYura, "#ff6b35", "Юра");

      const points = [...byKostya, ...byYura];
      if (points.length > 0) {
        const bounds = new google.maps.LatLngBounds();
        points.forEach(p => bounds.extend(p));
        map.fitBounds(bounds);
      }

      function formatPos(data) {
        if (!data) return "нет данных";
        const ts = data.timestamp ? data.timestamp.slice(0, 16).replace("T", " ") : "";
        return `${parseFloat(data.lat).toFixed(4)}, ${parseFloat(data.lon).toFixed(4)}${ts ? " · " + ts : ""}`;
      }

      document.getElementById("pos-kostya").textContent = formatPos(lastKostya) + (byKostya.length ? ` (${byKostya.length} pts)` : "");
      document.getElementById("pos-yura").textContent = formatPos(lastYura) + (byYura.length ? ` (${byYura.length} pts)` : "");

      const now = new Date();
      document.getElementById("updated").textContent =
        "обновлено " + now.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});

    } catch (e) {
      console.error(e);
      document.getElementById("pos-kostya").textContent = "ошибка загрузки";
      document.getElementById("pos-yura").textContent = "ошибка загрузки";
    }
  }

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 5,
      center: { lat: 28.1, lng: -15.4 },
      mapTypeId: "hybrid",
      styles: [
        { elementType: "labels.text.fill", stylers: [{ color: "#8ec3e0" }] },
        { featureType: "water", elementType: "geometry", stylers: [{ color: "#0a1e35" }] },
      ],
      mapTypeControl: true,
      mapTypeControlOptions: {
        style: google.maps.MapTypeControlStyle.DROPDOWN_MENU,
      },
      zoomControl: true,
      streetViewControl: false,
      fullscreenControl: true,
    });
    loadTrack();
  }

  // Автообновление каждые 5 минут
  setInterval(loadTrack, 5 * 60 * 1000);
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA5lsK0jjMceIO43iC3v_JS-nec6r1lzig&callback=initMap"
  async defer>
</script>

</body>
